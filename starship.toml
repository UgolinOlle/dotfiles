# ============================================================
#  starship.toml — universal (light+dark) · zsh (macOS) · MAXED
# ============================================================

format = """
[╭─────⭕ ](fg:#839496)\
$username\
$hostname\
[   📁 ](fg:#839496)\
$directory\
\n[│](fg:#839496)  \
[Branch:](dimmed) \
$git_branch\
[  ](fg:#839496)\
[Status:](dimmed) \
$git_status\
[  ](fg:#839496)\
[Commit:](dimmed) \
$git_commit\
[  ](fg:#839496)\
[State:](dimmed) \
$git_state\
[  ](fg:#839496)\
[Metrics:](dimmed) \
$git_metrics\
\n[│](fg:#839496)  \
[MEM: ](dimmed)\
$memory_usage\
[   BAT: ](dimmed)\
$battery\
[   ](dimmed)\
$time\
\n[│](fg:#839496)  \
([ENV: ](dimmed)$env_var)\
([   DIRENV: ](dimmed)$direnv)\
([   PKG: ](dimmed)$package)\
([   CC: ](dimmed)$c)\
([   CMAKE: ](dimmed)$cmake)\
$nodejs\
$bun\
$python\
$conda\
$rust\
$golang\
$java\
$kotlin\
$lua\
$ruby\
$php\
$docker_context\
$terraform\
$helm\
$kubernetes\
\n[│](fg:#839496)  \
$cmd_duration\
[   ](fg:#839496)\
$jobs\
[   ](fg:#839496)\
$shlvl\
[   ](fg:#839496)\
$shell\
[\n╰─](fg:#839496)\
$character\
"""

right_format = ""
palette      = 'universal'

[palettes.universal]
text         = '#6c71c4'
border       = '#839496'
color_blue   = '#268bd2'
color_aqua   = '#2aa198'
color_green  = '#859900'
color_orange = '#cb4b16'
color_red    = '#dc322f'
color_yellow = '#b58900'
color_pink   = '#d33682'
color_purple = '#8558c9'
color_violet = '#6c71c4'
red          = '#dc322f'

# ============================================================
#  Row 1 — Identity
# ============================================================

[username]
show_always = true
style_user  = "fg:#6c71c4 bold underline"
style_root  = "fg:#dc322f bold underline"
format      = "[$user]($style)"

[hostname]
ssh_only = true
style    = "fg:#839496 bold"
format   = "[@$hostname ]($style)"


[directory]
style             = "fg:#839496 bold"
format            = "[$path ]($style)"
truncation_length = 100
truncation_symbol = ""
use_os_path_sep   = false
truncate_to_repo  = false
use_logical_path  = true

[directory.substitutions]
"Documents" = "Docs"
"Downloads" = "DL"
"Desktop"   = "Desk"
"Projects"  = "Proj"

# ============================================================
#  Row 2 — Git full details
# ============================================================

[git_branch]
symbol   = "⎇"
style    = "fg:#b58900 bold"
format   = "[$symbol $branch(:$remote_branch) ]($style)"

[git_status]
style      = "fg:#cb4b16"
format     = "[$all_status$ahead_behind ]($style)"
ahead      = "^$count"
behind     = "v$count"
diverged   = "^${ahead_count}v${behind_count}"
untracked  = "?$count"
stashed    = "S$count"
modified   = "!$count"
staged     = "+$count"
deleted    = "x$count"
conflicted = "=$count"
renamed    = "r$count"

[git_commit]
only_detached      = false
format             = "[@$hash$tag ](fg:#d33682)"
commit_hash_length = 6
tag_symbol         = " #"
tag_disabled       = false

[git_state]
style           = "fg:#dc322f bold"
format          = "[$state($progress_current/$progress_total) ]($style)"
rebase          = "REBASE"
merge           = "MERGE"
revert          = "REVERT"
cherry_pick     = "CHERRY"
bisect          = "BISECT"
am              = "AM"
am_or_rebase    = "AM/REBASE"

[git_metrics]
disabled              = false
added_style           = "fg:#859900 bold"
deleted_style         = "fg:#dc322f bold"
format                = "[+$added ]($added_style)[-$deleted ]($deleted_style)"
only_nonzero_diffs    = true

# ============================================================
#  Row 3 — Shell info
# ============================================================

[cmd_duration]
min_time          = 500
style             = "fg:#6c71c4 bold"
format            = "[took $duration ]($style)"
show_milliseconds = true
min_time_to_notify = 10000

[jobs]
symbol    = "~"
style     = "fg:#2aa198 bold"
format    = "[$symbol$number jobs ]($style)"
threshold = 1

[shlvl]
disabled  = false
style     = "fg:#cb4b16 bold"
format    = "[SHLVL:$shlvl ]($style)"
threshold = 2
repeat    = false


# ============================================================
#  Row 4 — System stats
# ============================================================

[memory_usage]
disabled  = false
threshold = 0
style     = "fg:#6c71c4 bold"
format    = "[$ram_pct ($ram/$swap_pct swap) ]($style)"

[battery]
full_symbol        = "FULL"
charging_symbol    = "CHG"
discharging_symbol = "BAT"
unknown_symbol     = "BAT?"
empty_symbol       = "LOW!"
format             = "[$symbol $percentage ]($style)"

[[battery.display]]
threshold = 15
style     = "fg:#dc322f bold"

[[battery.display]]
threshold = 50
style     = "fg:#cb4b16 bold"

[[battery.display]]
threshold = 100
style     = "fg:#859900 bold"

[time]
disabled    = false
time_format = "%d %b %Y  %H:%M:%S"
style       = "fg:#2aa198 bold"
format      = "[$time ]($style)"


# ============================================================
#  Row 5 — Env vars, package, build tools & toolchain
#  (single row, all auto-hide — only shows when something's there)
# ============================================================

[env_var.VIRTUAL_ENV]
variable = "VIRTUAL_ENV"
style    = "fg:#d33682"
format   = "[$env_value ]($style)"

[direnv]
disabled = false
style    = "fg:#859900"
format   = "[$loaded/$allowed ]($style)"

[package]
disabled      = false
style         = "fg:#cb4b16 bold"
format        = "[$symbol$version ]($style)"
symbol        = "pkg:"
version_format = "v${raw}"

[c]
disabled = false
style    = "fg:#268bd2 bold"
format   = "[$symbol$version ]($style)"
symbol   = "C:"

[cmake]
disabled = false
style    = "fg:#268bd2"
format   = "[$symbol$version ]($style)"
symbol   = "cmake:"


[nodejs]
symbol = "Node"
format = "[$symbol:$version ](fg:#859900)"

[bun]
symbol = "Bun"
format = "[$symbol:$version ](fg:#b58900)"

[python]
symbol        = "Py"
format        = "[$symbol:$version( ($virtualenv)) ](fg:#b58900)"
python_binary = ["python3", "python"]

[conda]
symbol      = "conda"
format      = "[$symbol:$environment ](fg:#859900)"
ignore_base = true

[rust]
symbol = "Rs"
format = "[$symbol:$version ](fg:#cb4b16)"

[golang]
symbol = "Go"
format = "[$symbol:$version ](fg:#2aa198)"

[java]
symbol = "Java"
format = "[$symbol:$version ](fg:#d33682)"

[kotlin]
disabled = false
symbol   = "Kt"
format   = "[$symbol:$version ](fg:#8558c9)"

[lua]
disabled = false
symbol   = "Lua"
format   = "[$symbol:$version ](fg:#268bd2)"

[ruby]
disabled = false
symbol   = "Rb"
format   = "[$symbol:$version ](fg:#dc322f)"

[php]
disabled = false
symbol   = "PHP"
format   = "[$symbol:$version ](fg:#8558c9)"

[docker_context]
symbol          = "Docker"
format          = "[$symbol:$context ](fg:#268bd2)"
only_with_files = false

[terraform]
disabled = false
symbol   = "TF"
format   = "[$symbol:$workspace ](fg:#8558c9)"

[helm]
disabled = false
symbol   = "Helm"
format   = "[$symbol:$version ](fg:#268bd2)"

[kubernetes]
disabled = false
style    = "fg:#268bd2 bold"
format   = "[$symbol$context(::$namespace) ]($style)"
symbol   = "K8s:"


# ============================================================
#  Prompt character
# ============================================================

[character]
format         = "$symbol "
success_symbol = "[➤ ](bold fg:#839496)"
error_symbol   = "[➤ ](bold fg:#dc322f)"
vimcmd_symbol  = "[N ](bold fg:#859900)"
