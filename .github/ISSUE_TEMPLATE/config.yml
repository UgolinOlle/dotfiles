name: Issue Templates
description: Choose a template for your issue
title: "[ISSUE] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue!
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - Bug Report
        - Feature Request
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a clear and concise description of the issue
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide steps to reproduce the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the issue here 

blank_issues_enabled: false
contact_links:
  - name: Questions & Discussions
    url: https://github.com/UgolinOlle/dotfiles/discussions
    about: Please ask and answer questions here.
  - name: Documentation
    url: https://github.com/UgolinOlle/dotfiles#readme
    about: Please check the documentation before opening an issue. 