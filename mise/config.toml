# --- MISE CONFIGURATION ------------------------------------------------------------------------------------------ #

[tools]
# Node.js - Use LTS for stability, can override per project
node = "22.19.0"

# Bun - Keep latest
bun = "latest"

# Python - Use latest stable
python = "3.12"

# Rust - Use stable channel
rust = "stable"

# Deno - Use latest
deno = "latest"
pnpm = "10.20.0"

[settings]
# Automatically install missing tools
auto_install = true

# Legacy version file support (.nvmrc, .python-version, etc.)
legacy_version_file = true
idiomatic_version_file_enable_tools = ["node", "python", "go", "rust"]

# Use system node for global packages when available

# Verbose output for debugging (set to true for troubleshooting)
verbose = false

# Experimental features
experimental = true

# Settings for specific tools
[settings.node]
compile = false

# Environment variables
[env]
MISE_USE_TOML = "1"
