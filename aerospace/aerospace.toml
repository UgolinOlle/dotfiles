# ─── Basic Configuration ────────────────────────────────────────────────────────
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'

# ─── Events ─────────────────────────────────────────────────────────────────────
after-login-command = []
after-startup-command = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = "move-mouse window-lazy-center"

# ─── Gaps ───────────────────────────────────────────────────────────────────────
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.top        = 10
outer.right      = 10
outer.bottom     = 10
outer.left       = 10

# ─── Monitor Assignment ─────────────────────────────────────────────────────────
[workspace-to-monitor-force-assignment]
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'
0 = 'secondary'

# ─── Keybindings: Main Mode ─────────────────────────────────────────────────────
[mode.main.binding]

# Layouts
alt-slash           = 'layout tiles horizontal vertical'
alt-comma           = 'layout accordion horizontal vertical'
alt-shift-f         = 'fullscreen'

# Workspace navigation
alt-tab             = 'workspace-back-and-forth'
alt-shift-tab       = 'move-workspace-to-monitor --wrap-around next'
ctrl-shift-tab      = 'move-node-to-monitor --wrap-around next'

# Change mode
alt-shift-semicolon = 'mode service'

# Focus movement
alt-h               = 'focus left'
alt-j               = 'focus down'
alt-k               = 'focus up'
alt-l               = 'focus right'

# Move windows
alt-shift-h         = 'move left'
alt-shift-j         = 'move down'
alt-shift-k         = 'move up'
alt-shift-l         = 'move right'

# Resize windows
alt-shift-minus     = 'resize smart -50'
alt-shift-equal     = 'resize smart +50'

# Change workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'

# Move window to workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 0'

# ─── Keybindings: Service Mode ──────────────────────────────────────────────────
[mode.service.binding]

esc         = ['reload-config', 'mode main']
r           = ['flatten-workspace-tree', 'mode main']          # Reset layout
f           = ['layout floating tiling', 'mode main']          # Toggle layout
backspace   = ['close-all-windows-but-current', 'mode main']

# Merge containers
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ─── App Auto-Assignment Rules ──────────────────────────────────────────────────

# ─── Workspace 1 – Navigation ─────────────────────────────────────────────

[[on-window-detected]]
if.app-id = 'company.thebrowser.dia'
run = 'move-node-to-workspace 1'

# ─── Workspace 2 / 3 – Développement ─────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 3'

# ─── Workspace 4 – API / Base de données ─────────────────────────────────

[[on-window-detected]]
if.app-id = 'io.httpie.desktop'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.tinyapp.TablePlus'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'io.podmandesktop.PodmanDesktop'
