# ─── Basic Configuration ────────────────────────────────────────────────────────
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'

# ─── Events ─────────────────────────────────────────────────────────────────────
after-login-command = []
after-startup-command = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ─── Gaps ───────────────────────────────────────────────────────────────────────
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.top = 10
outer.right = 10
outer.bottom = 10
outer.left = 10

# ─── Monitor Assignment ─────────────────────────────────────────────────────────
# The first connected monitor in each list wins. Entries are regex on the name.
#   1-4 : PL2493H (2)
#   5-7 : built-in Retina display
#   8-0 : PL2493H (1)
[workspace-to-monitor-force-assignment]
1 = ['PL2493H \(2\)', 'MSI G255F', 'main']
2 = ['PL2493H \(2\)', 'MSI G255F', 'main']
3 = ['PL2493H \(2\)', 'MSI G255F', 'main']
4 = ['PL2493H \(2\)', 'MSI G255F', 'main']
5 = ['built-in', 'main']
6 = ['built-in', 'main']
7 = ['built-in', 'main']
8 = ['PL2493H \(1\)', 'VG2448', 'main']
9 = ['PL2493H \(1\)', 'VG2448', 'main']
0 = ['PL2493H \(1\)', 'VG2448', 'main']

# ─── Keybindings: Main Mode ─────────────────────────────────────────────────────
[mode.main.binding]

# Layouts
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'fullscreen'
alt-shift-r = 'flatten-workspace-tree'
alt-shift-b = 'balance-sizes'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Monitor navigation
alt-ctrl-h = 'focus-monitor --wrap-around left'
alt-ctrl-l = 'focus-monitor --wrap-around right'
alt-ctrl-shift-h = [
  'move-node-to-monitor --wrap-around left',
  'focus-monitor --wrap-around left',
]
alt-ctrl-shift-l = [
  'move-node-to-monitor --wrap-around right',
  'focus-monitor --wrap-around right',
]

# Change mode
alt-shift-semicolon = 'mode service'
alt-r = 'mode resize'

# Focus movement
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize windows
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Change workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'
alt-a = 'workspace 0' # AI

# Move window to workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 0'

# ─── Keybindings: Resize Mode ───────────────────────────────────────────────────
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
b = 'balance-sizes'
enter = 'mode main'
esc = 'mode main'

# ─── Keybindings: Service Mode ──────────────────────────────────────────────────
[mode.service.binding]
esc = ['reload-config', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join windows into a container
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

