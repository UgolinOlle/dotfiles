# ─── Workspace 0 – Détente / Musique ─────────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 0'

# --- Miscellaneous -------------------------------------------------------

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

