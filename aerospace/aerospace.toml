# ─── Workspace 9 – Utilitaires système ───────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.macpaw.CleanMyMac5'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
